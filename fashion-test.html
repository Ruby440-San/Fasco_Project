      justify-content: center;
      align-items: center;
    }

    .swiper-slide img {

      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .swiper-pagination-bullet {
      width: 20px;
      height: 20px;
      text-align: center;
      line-height: 20px;
      font-size: 12px;
      color: #000;
      opacity: 1;
      background: rgba(0, 0, 0, 0.2);

    var swiper = new Swiper(".mySwiper", {
