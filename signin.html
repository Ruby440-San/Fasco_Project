<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="./src/output.css" rel="stylesheet">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <title>SignIn</title>
</head>
<body>
  <div class="container mx-auto xl:min-h-175 p-5 md:px-20 xl:py-0">
    <div class="flex flex-col-reverse md:flex-row mt-5">
        <div class="w-150 xl:w-650 md:rounded-tl-4xl md:rounded-bl-4xl shadow-2xl" data-aos="zoom-in-up"  data-aos-duration="1000">
          <img src="images/bg1.jpg" alt="" class="w-full md:h-145 object-cover object-top md:rounded-tl-4xl md:rounded-bl-4xl">
        </div>
        <div class="border border-gray-100 w-150 xl:w-350 md:rounded-tr-4xl md:rounded-br-4xl flex flex-col  justify-center items-center px-10 py-10 md:py-0 shadow-2xl shadow-black">
          <h2 class="text-xl xl:text-2xl text-zinc-600 mb-5 xl:mb-8" data-aos="fade-down" data-aos-duration="1000">FASCO FASHION</h2>
          <h1 class="text-2xl xl:text-3xl text-zinc-600 mb-3" data-aos="fade-down" data-aos-duration="1000">Forgot your Password?</h1>
          <span class="text-xs text-zinc-400 mb-8 tracking-wide" data-aos="fade-down" data-aos-duration="1000">To reset your password, enter your e-mail address</span>
          <input type="email" class="px-4 py-2.5 border border-gray-300 w-80 outline-none mb-3" id="" placeholder="Email" data-aos="fade-right" data-aos-duration="1000">
          <button class="px-2 py-2.5 border border-gray-300 w-80 bg-purple-700 hover:bg-purple-400 hover:text-black text-white mb-8" data-aos="fade-left" data-aos-duration="1000">Reset Password</button>
          <p class="text-xs text-zinc-400" data-aos="zoom-in-right" data-aos-duration="1000">Don't have an account? <a href="signup.html" class="text-black underline">Sign up</a></p>
        </div>
      </div>
  </div>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
  AOS.init();
</script>
</body>
</html>
