<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="./src/output.css" rel="stylesheet">
  <title>SignIn</title>
</head>
<body>
  <div class="container mx-auto min-h-175 px-5">
    <div class="flex">
        <div class="w-650 rounded-tl-4xl rounded-bl-4xl shadow-2xl">
          <img src="images/bg1.jpg" alt="" class="w-full h-145 object-cover object-top rounded-tl-4xl rounded-bl-4xl">
        </div>
        <div class="border border-gray-100 w-350 rounded-tr-4xl rounded-br-4xl flex flex-col  justify-center items-center px-10 shadow-2xl shadow-black">
          <h2 class="text-2xl text-zinc-600 mb-8">FASCO FASHION</h2>
          <h1 class="text-3xl text-zinc-600 mb-3">Forgot your Password?</h1>
          <span class="text-xs text-zinc-400 mb-8 tracking-wide">To reset your password, enter your e-mail address</span>
          <input type="email" class="px-4 py-2.5 border border-gray-300 w-80 outline-none mb-3" id="" placeholder="Email">
          <button class="px-2 py-2.5 border border-gray-300 w-80 bg-purple-700 text-white mb-8">Reset Password</button>
          <p class="text-xs text-zinc-400">Don't have an account? <a href="#" class="text-black underline">Sign up</a></p>
        </div>
      </div>
  </div>
</body>
</html>
