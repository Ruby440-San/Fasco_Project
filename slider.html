<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Swiper demo</title>
  <link href="./src/output.css" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1" />
  <!-- Link Swiper's CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />

  <!-- Demo styles -->
  <style>
    html,
    body {
      position: relative;
      height: 100%;
    }

    body {
      font-family: Helvetica Neue, Helvetica, Arial, sans-serif;
      font-size: 14px;
      color: #fff;
      margin: 0;
      padding: 0;
    }
    .container{
      height: 500px;
    }

    .swiper {
      width: 650px;
      height: 500px;
    }

    .swiper-slide {
      height: 450px;
      text-align: center;
      font-size: 18px;
      background: #444;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .swiper-slide img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .swiper-slide-active{
      height: 500px;
    }
    .swiper-pagination{
      bottom: 30px !important;
      left: -130px !important;
}

    .swiper-pagination-bullet{
      width: 10px;
      height: 10px;
      background-color: gray;
    }
    .swiper-pagination-bullet-active{
      background: #000;
      outline: 1px solid #000;
      outline-offset: 4px;
    }
    .btn-container{
      position: relative !important;
      bottom: 30px;
      display: flex;
      gap: 5px;
    }
    .btn-circle{
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background-color: #f0e5e5;
      position: relative;
      left: 10px;
    }
    .swiper-button-next,
    .swiper-button-prev{
      width: 13px;
      height: 13px;
      color: black;
      position: absolute !important;
    }
    .swiper-button-next{
      top: 30px !important;
      left: 45px !important;
    }
    .swiper-button-prev{
      top: 30px !important;
      left: -28px !important;
    }
  </style>
</head>

<body>
  <!-- Swiper -->
   
  <div class="container">
    <div class="swiper mySwiper">
      <div class="swiper-wrapper">
        <div class="swiper-slide">
          <img src="images/image.png" alt="" class="w-full h-full object-top object-cover lg:object-cover">
        </div>
        <div class="swiper-slide">
          <img src="images/image_1.png" alt="" class="w-90 md:w-70 md:h-70 h-125 lg:w-65 lg:h-110 object-cover">
        </div>
        <div class="swiper-slide">
          <img src="images/image-1.png" alt="" class="w-90 md:w-70 md:h-70 h-125 lg:w-65 lg:h-110 object-top object-cover lg:object-cover">
        </div>
        <div class="swiper-slide">
          <img src="images/image-4.png" alt="" class="w-90 md:w-70 md:h-70 h-125 lg:w-65 lg:h-110 object-top object-cover lg:object-cover">
        </div>
        <div class="swiper-slide">
          <img src="images/image-3.png" alt="" class="w-90 md:w-70 md:h-70 h-125 lg:w-65 lg:h-110 object-top object-cover lg:object-cover">
        </div>
        <div class="swiper-slide">
          <img src="images/image-2.png" alt="" class="w-90 md:w-70 md:h-70 h-125 lg:w-65 lg:h-110 object-top object-cover lg:object-cover">
        </div>
        
      </div>
  </div>
  <div class="btn-container">
    <div class="btn-circle"><div class="swiper-button-next"></div></div>
    <div class="btn-circle"><div class="swiper-button-prev"></div></div>
  </div>
  <div class="swiper-pagination"></div>
    
  </div>
  

  <!-- Swiper JS -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>

  <!-- Initialize Swiper -->
  <script>
    var swiper = new Swiper(".mySwiper", {
      slidesPerView: 3,
      spaceBetween: 30,
      freeMode: true,
       navigation: {
        nextEl: ".swiper-button-next",
        prevEl: ".swiper-button-prev",
      },
      pagination: {
        el: ".swiper-pagination",
        clickable: true,
      },
    });
  </script>
</body>

</html>
